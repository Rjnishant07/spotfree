# Use this ONLY if the backend is deployed from its own repo (this folder is the repo root).
# If backend/ lives inside the full SpotFree repo, use the render.yaml at that repo's root instead.
services:
  - type: web
    name: spotfree-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: DATABASE_SSL
        value: "true"
      - key: OTP_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
