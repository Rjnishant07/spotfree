# Render Blueprint: New > Blueprint > pick this repo. Only the backend runs on Render;
# the frontend goes on Vercel and the database on Neon (see DEPLOY.md).
services:
  - type: web
    name: spotfree-api
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: DATABASE_SSL
        value: "true"
      # Generated by Render (long random strings, kept secret)
      - key: OTP_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      # You fill these in on the Render dashboard
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
