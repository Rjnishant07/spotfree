<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "on-tertiary-container": "#6780d3", "primary-container": "#131b2e", "on-tertiary-fixed": "#00164e", "surface-container": "#e5eeff", "inverse-primary": "#bec6e0", "primary": "#000000", "surface-container-highest": "#d3e4fe", "surface-dim": "#cbdbf5", "error": "#ba1a1a", "on-surface-variant": "#45464d", "secondary-fixed": "#6ffbbe", "inverse-on-surface": "#eaf1ff", "on-secondary": "#ffffff", "on-tertiary": "#ffffff", "surface-container-low": "#eff4ff", "tertiary-container": "#00164e", "primary-fixed-dim": "#bec6e0", "on-error": "#ffffff", "primary-fixed": "#dae2fd", "on-primary-fixed-variant": "#3f465c", "on-secondary-fixed": "#002113", "on-surface": "#0b1c30", "surface-tint": "#565e74", "on-primary-container": "#7c839b", "tertiary": "#000000", "secondary": "#006c49", "surface": "#f8f9ff", "surface-container-high": "#dce9ff", "surface-container-lowest": "#ffffff", "outline-variant": "#c6c6cd", "outline": "#76777d", "secondary-container": "#6cf8bb", "on-error-container": "#93000a", "on-background": "#0b1c30", "secondary-fixed-dim": "#4edea3", "inverse-surface": "#213145", "on-secondary-fixed-variant": "#005236", "surface-bright": "#f8f9ff", "surface-variant": "#d3e4fe", "background": "#f8f9ff", "on-secondary-container": "#00714d", "on-tertiary-fixed-variant": "#264191", "error-container": "#ffdad6", "tertiary-fixed": "#dce1ff", "on-primary": "#ffffff", "on-primary-fixed": "#131b2e", "tertiary-fixed-dim": "#b6c4ff" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "space-md": "1rem", "gutter": "1rem", "space-sm": "0.5rem", "space-xs": "0.25rem", "margin": "1rem", "space-xl": "2rem", "space-lg": "1.5rem" }, fontFamily: { "headline-lg": ["Inter"], "headline-sm": ["Inter"], "body-lg": ["Inter"], "label-md": ["Inter"], "title-md": ["Inter"], "title-sm": ["Inter"], "body-sm": ["Inter"], "headline-md": ["Inter"], "label-sm": ["Inter"], "body-md": ["Inter"] }, fontSize: { "headline-lg": ["30px", { lineHeight: "38px", letterSpacing: "-0.02em", fontWeight: "700" }], "headline-sm": ["20px", { lineHeight: "26px", letterSpacing: "-0.01em", fontWeight: "600" }], "body-lg": ["16px", { lineHeight: "24px", letterSpacing: "-0.005em", fontWeight: "400" }], "label-md": ["12px", { lineHeight: "16px", letterSpacing: "0.02em", fontWeight: "600" }], "title-md": ["17px", { lineHeight: "22px", letterSpacing: "-0.005em", fontWeight: "600" }], "title-sm": ["15px", { lineHeight: "20px", letterSpacing: "0em", fontWeight: "600" }], "body-sm": ["13px", { lineHeight: "18px", letterSpacing: "0.005em", fontWeight: "400" }], "headline-md": ["24px", { lineHeight: "32px", letterSpacing: "-0.015em", fontWeight: "600" }], "label-sm": ["11px", { lineHeight: "14px", letterSpacing: "0.03em", fontWeight: "500" }], "body-md": ["14px", { lineHeight: "20px", letterSpacing: "0em", fontWeight: "400" }] } } } }</script><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-surface font-body-md text-body-md text-on-surface pt-safe pb-safe flex flex-col min-h-screen antialiased"><main class="flex flex-col relative w-full bg-surface px-margin flex-1"><div class="flex flex-col w-full pb-8">
<div class="flex flex-col items-center text-center mt-4 mb-6">
<div class="w-16 h-16 rounded-xl bg-primary-container flex items-center justify-center shadow-md mb-3 relative overflow-hidden">
<div class="absolute -right-2 -bottom-2 w-8 h-8 rounded-full bg-secondary-container/20"></div>
<span class="material-symbols-outlined text-secondary-container text-3xl">meeting_room</span>
</div>
<div class="flex items-center gap-1.5 justify-center">
<span class="font-headline-md text-headline-md tracking-tight text-on-surface">Spot<span class="text-secondary">Free</span></span>
<span class="bg-secondary-container/30 text-on-secondary-container text-[10px] font-bold px-1.5 py-0.5 rounded uppercase tracking-wider">HIT</span>
</div>
<p class="font-label-md text-label-md text-on-surface-variant font-medium mt-0.5">Heritage Institute of Technology</p>
<p class="font-body-sm text-body-sm text-outline mt-1 italic tracking-wide">Find. Learn. Use. Better Spaces.</p>
</div>

<div class="bg-surface-container-lowest rounded-xl p-5 shadow-sm flex flex-col gap-4">
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Select Role</label>
<div class="grid grid-cols-3 gap-1.5 p-1 bg-surface-container-low rounded-lg" id="roleSelector">
<button class="flex flex-col items-center justify-center py-2 px-1 rounded-md text-center bg-surface-container-lowest text-on-surface shadow-sm transition-all duration-150" id="btn-student" onclick="selectRole('student')" type="button">
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-sm text-secondary" id="check-student" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-md text-label-md font-semibold">Student</span>
</div>
</button>
<button class="flex flex-col items-center justify-center py-2 px-1 rounded-md text-center text-on-surface-variant hover:text-on-surface transition-all duration-150" id="btn-faculty" onclick="selectRole('faculty')" type="button">
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-sm hidden text-secondary" id="check-faculty" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-md text-label-md font-medium">Faculty</span>
</div>
</button>
<button class="flex flex-col items-center justify-center py-2 px-1 rounded-md text-center text-on-surface-variant hover:text-on-surface transition-all duration-150" id="btn-admin" onclick="selectRole('admin')" type="button">
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-sm hidden text-secondary" id="check-admin" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-md text-label-md font-medium">Admin</span>
</div>
</button>
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface font-medium" for="uid">Username / University ID</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline text-xl pointer-events-none">person</span>
<input class="w-full h-12 pl-10 pr-3 rounded-lg bg-surface-container-low text-on-surface font-body-md text-body-md placeholder:text-outline/70 focus:outline-none focus:bg-surface-container-lowest transition-colors" id="uid" placeholder="e.g. 2024it1042 or faculty ID" type="text">
</div>
</div>
<div class="flex flex-col gap-1.5">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface font-medium" for="password">Password</label>
<span class="font-label-sm text-label-sm text-secondary cursor-pointer">SSO Key</span>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline text-xl pointer-events-none">lock</span>
<input class="w-full h-12 pl-10 pr-11 rounded-lg bg-surface-container-low text-on-surface font-body-md text-body-md placeholder:text-outline/70 focus:outline-none focus:bg-surface-container-lowest transition-colors" id="password" placeholder="Enter HIT portal passphrase" type="password">
<button aria-label="Toggle password view" class="absolute right-0 top-0 bottom-0 w-11 flex items-center justify-center text-outline hover:text-on-surface transition-colors" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-xl" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<div class="flex items-center justify-between pt-1">
<label class="flex items-center gap-2 cursor-pointer">
<input checked="" class="w-4 h-4 rounded text-primary-container focus:ring-0 accent-primary-container" type="checkbox">
<span class="font-body-sm text-body-sm text-on-surface-variant">Remember terminal ID</span>
</label>
<span class="font-label-sm text-label-sm text-outline-variant hover:text-on-surface cursor-pointer">Help?</span>
</div>
<button class="w-full h-12 rounded-xl bg-tertiary-container text-on-tertiary font-title-sm text-title-sm font-bold flex items-center justify-center gap-2 shadow-md active:scale-[0.98] transition-transform mt-2" type="button">
<span class="">LOGIN</span>
<span class="material-symbols-outlined text-base">arrow_forward</span>
</button>
<div class="flex justify-center mt-1">
<a class="font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors py-1" href="#">Forgot Password?</a>
</div>
</div>
<div class="mt-6 flex flex-col items-center text-center gap-3">
<div class="flex items-center gap-2 bg-surface-container-high/60 px-3 py-1.5 rounded-full">
<span class="material-symbols-outlined text-sm text-secondary">verified_user</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Institutional Single Sign-On enabled for HIT campus accounts</span>
</div>
<div class="flex items-center justify-center gap-4 text-outline font-label-sm text-label-sm mt-1">
<span class="hover:text-on-surface cursor-pointer">Campus Map</span>
<span class="">•</span>
<span class="hover:text-on-surface cursor-pointer">Help Desk</span>
<span class="">•</span>
<span class="hover:text-on-surface cursor-pointer">Security Protocol</span>
</div>
</div>
</div>
<script>
  function togglePasswordVisibility() {
    var passInput = document.getElementById('password');
    var eye = document.getElementById('eyeIcon');
    if (passInput.type === 'password') {
      passInput.type = 'text';
      eye.textContent = 'visibility_off';
    } else {
      passInput.type = 'password';
      eye.textContent = 'visibility';
    }
  }

  function selectRole(role) {
    var roles = ['student', 'faculty', 'admin'];
    roles.forEach(function(r) {
      var btn = document.getElementById('btn-' + r);
      var check = document.getElementById('check-' + r);
      if (r === role) {
        btn.className = 'flex flex-col items-center justify-center py-2 px-1 rounded-md text-center bg-surface-container-lowest text-on-surface shadow-sm transition-all duration-150';
        if (check) check.classList.remove('hidden');
      } else {
        btn.className = 'flex flex-col items-center justify-center py-2 px-1 rounded-md text-center text-on-surface-variant hover:text-on-surface transition-all duration-150';
        if (check) check.classList.add('hidden');
      }
    });
  }
</script></main>

</body></html>
