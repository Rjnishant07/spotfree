// Helper: current user
function getCurrentUser() {
  return DB.profiles[DB.currentRole] || DB.profiles.student;
}

// Navigation stack management
function navTo(view, push = true) {
  if (push && DB.currentView !== view) {
    DB.navHistory.push(DB.currentView);
  }
  DB.currentView = view;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function navBack() {
  if (DB.navHistory.length > 0) {
    const prev = DB.navHistory.pop();
    DB.currentView = prev;
  } else {
    // default fallback
    DB.currentView = DB.currentRole === 'student' ? 'student-home' : DB.currentRole === 'faculty' ? 'faculty-home' : 'admin-home';
  }
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function setGlobalRole(role) {
  DB.currentRole = role;
  DB.navHistory = [];
  if (role === 'student') navTo('student-home', false);
  else if (role === 'faculty') navTo('faculty-home', false);
  else navTo('admin-home', false);
  showToast(`Switched role to ${role.toUpperCase()} (${getCurrentUser().name})`);
}

function navBottom(tab) {
  if (tab === 'dashboard') {
    if (DB.currentRole === 'student') navTo('student-home');
    else if (DB.currentRole === 'faculty') navTo('faculty-home');
    else navTo('admin-home');
  } else if (tab === 'scanner') {
    navTo('screen-scan-qr');
  } else if (tab === 'status') {
    if (DB.currentRole === 'admin' || DB.currentRole === 'faculty') {
      navTo('status-history');
    } else {
      navTo('rooms-availability');
    }
  } else if (tab === 'admin') {
    DB.currentRole = 'admin';
    navTo('admin-home');
  }
}

// Global Toast
function showToast(msg, icon = 'check_circle') {
  const el = document.getElementById('toast');
  document.getElementById('toast-text').textContent = msg;
  document.getElementById('toast-icon').textContent = icon;
  el.classList.remove('hidden');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => el.classList.add('hidden'), 2600);
}

function showLiveBanner(room, newStatus) {
  const b = document.getElementById('live-banner');
  const t = document.getElementById('live-banner-text');
  if (!b || !t) return;
  t.textContent = `Room ${room} updated to ${newStatus} (Live Synced)`;
  b.classList.remove('hidden');
  clearTimeout(window.__bannerTimer);
  window.__bannerTimer = setTimeout(() => {
    b.classList.add('hidden');
  }, 4500);
}

function dismissLiveBanner() {
  const b = document.getElementById('live-banner');
  if (b) b.classList.add('hidden');
}

// Status Badges
function getBadge(status) {
  if (status === 'VACANT' || status === 'FREE') {
    return `<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-emerald-100 text-emerald-800 border border-emerald-300"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>VACANT</span>`;
  }
  if (status === 'OCCUPIED') {
    return `<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-rose-100 text-rose-800 border border-rose-300"><span class="w-1.5 h-1.5 rounded-full bg-rose-500"></span>OCCUPIED</span>`;
  }
  if (status === 'RESERVED') {
    return `<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-amber-100 text-amber-800 border border-amber-300"><span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>RESERVED</span>`;
  }
  return `<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-slate-200 text-slate-700 border border-slate-300"><span class="w-1.5 h-1.5 rounded-full bg-slate-400"></span>NO INFO</span>`;
}

// Centralized status mutation
function updateRoomStatus(roomId, newStatus, remarks = '') {
  const r = DB.rooms.find(rm => rm.id === roomId);
  if (!r) return;
  const oldStatus = r.status;
  r.status = newStatus;

  if (newStatus === 'VACANT') {
    r.timeText = 'Available now for study / session';
  } else if (newStatus === 'OCCUPIED') {
    r.timeText = `Occupied in session • ${remarks || 'Active class'}`;
  } else if (newStatus === 'RESERVED') {
    r.timeText = `Reserved • ${remarks || 'Campus reservation'}`;
  } else {
    r.timeText = 'Sensor pending update';
  }

  const u = getCurrentUser();
  DB.history.unshift({
    id: Date.now(),
    room: roomId,
    from: oldStatus,
    to: newStatus,
    by: u.name,
    time: 'Just now',
    note: remarks || 'Status updated via app'
  });

  DB.notifications.unshift({
    id: Date.now(),
    title: `Room ${roomId} Status Changed`,
    desc: `Marked as ${newStatus} by ${u.name}`,
    time: 'Just now',
    unread: true
  });

  showLiveBanner(roomId, newStatus);
  showToast(`${roomId} marked as ${newStatus}`);
}

}

function handleProcessWizard(e) {
  e.preventDefault();

  DB.recommendedRoom = candidate;
  navTo('wizard-res');
}

function selectStatusTab(st) {
  activeChoiceStatus = st;
  ['VACANT', 'OCCUPIED', 'RESERVED'].forEach(s => {
    const el = document.getElementById('btn-st-' + s.toLowerCase());
    if (!el) return;
    if (s === st) {
      el.className = `p-2.5 rounded-xl border-2 flex flex-col items-center justify-center gap-1 font-bold ${s === 'VACANT' ? 'border-emerald-500 bg-emerald-50 text-emerald-800' : s === 'OCCUPIED' ? 'border-rose-500 bg-rose-50 text-rose-800' : 'border-amber-500 bg-amber-50 text-amber-800'}`;
    } else {
      el.className = 'p-2.5 rounded-xl border-2 border-slate-200 text-slate-600 flex flex-col items-center justify-center gap-1';
    }
  });

  const resBox = document.getElementById('reserved-period-box');
  if (resBox) {
    resBox.className = st === 'RESERVED' ? 'block p-2.5 bg-amber-50 rounded-xl border border-amber-200' : 'hidden';
  }
}

function handleConfirmStatusUpdate(e, roomId) {
  e.preventDefault();

  DB.rooms.unshift({

function applyRoomEdit(roomId) {
  const r = DB.rooms.find(rm => rm.id === roomId);
  if (!r) return;
  const newCap = parseInt(document.getElementById('modal-ed-cap').value) || r.capacity;
  const newType = document.getElementById('modal-ed-type').value;
  const newSt = document.getElementById('modal-ed-status').value;

  r.capacity = newCap;
  r.type = newType;
  if (r.status !== newSt) {
    updateRoomStatus(roomId, newSt, 'Updated via Admin Room Edit');
  }
  closeModal();
  showToast(`Updated ${roomId}`);
  render();
}

/* ============================================================
   MAIN RENDERER ROUTER
   ============================================================ */
function render() {
  const container = document.getElementById('app');
  const bottomNav = document.getElementById('bottom-nav');

  // Control Bottom Nav visibility
  if (DB.currentView === 'login') {
    bottomNav.classList.add('hidden');
  } else {
    bottomNav.classList.remove('hidden');

    // Update bottom nav highlighting
    const isDash = DB.currentView === 'student-home' || DB.currentView === 'faculty-home' || DB.currentView === 'admin-home';
    const isScan = DB.currentView === 'screen-scan-qr' || DB.currentView === 'screen-enter-room' || DB.currentView === 'screen-room-identified';
    const isStatus = DB.currentView === 'rooms-availability' || DB.currentView === 'room-detail' || DB.currentView === 'status-history' || DB.currentView === 'wizard-req' || DB.currentView === 'wizard-res';
    const isAdmin = DB.currentView === 'admin-manage-rooms' || (DB.currentRole === 'admin' && isDash);

    document.getElementById('bnav-dashboard').className = isDash && !isAdmin ? 'flex flex-col items-center gap-0.5 py-1 px-3 text-emerald-600 font-bold text-[11px]' : 'flex flex-col items-center gap-0.5 py-1 px-3 text-slate-500 hover:text-slate-900 text-[11px]';
    document.getElementById('bnav-scanner').className = isScan ? 'flex flex-col items-center gap-0.5 py-1 px-3 text-emerald-600 font-bold text-[11px]' : 'flex flex-col items-center gap-0.5 py-1 px-3 text-slate-500 hover:text-slate-900 text-[11px]';
    document.getElementById('bnav-status').className = isStatus ? 'flex flex-col items-center gap-0.5 py-1 px-3 text-emerald-600 font-bold text-[11px]' : 'flex flex-col items-center gap-0.5 py-1 px-3 text-slate-500 hover:text-slate-900 text-[11px]';
    document.getElementById('bnav-admin').className = (DB.currentRole === 'admin' || DB.currentView.startsWith('admin')) ? 'flex flex-col items-center gap-0.5 py-1 px-3 text-emerald-600 font-bold text-[11px]' : 'flex flex-col items-center gap-0.5 py-1 px-3 text-slate-500 hover:text-slate-900 text-[11px]';

    // Label on third tab
    const lbl = document.getElementById('bnav-status-label');
    const ico = document.getElementById('bnav-status-icon');
    if (DB.currentRole === 'admin' || DB.currentRole === 'faculty') {
      lbl.textContent = 'History';
      ico.textContent = 'history';
    } else {
      lbl.textContent = 'Availability';
      ico.textContent = 'meeting_room';
    }
  }

  // Update Top Role Switcher Pills
  ['student', 'faculty', 'admin'].forEach(r => {
    const el = document.getElementById('pill-' + r);
    if (!el) return;
    if (DB.currentRole === r && DB.currentView !== 'login') {
      el.className = 'px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-500 text-slate-950';
    } else {
      el.className = 'px-2 py-0.5 rounded text-[10px] font-medium text-slate-300 hover:text-white';
    }
  });

  // View switch
  switch (DB.currentView) {
    case 'login': container.innerHTML = viewLogin(); break;
    case 'student-home': container.innerHTML = viewStudentHome(); break;
    case 'rooms-availability': container.innerHTML = viewRoomsAvailability(); break;
    case 'room-detail': container.innerHTML = viewRoomDetail(); break;
    case 'wizard-req': container.innerHTML = viewWizardReq(); break;
    case 'wizard-res': container.innerHTML = viewWizardRes(); break;
    case 'screen-scan-qr': container.innerHTML = viewScanQr(); break;
    case 'screen-enter-room': container.innerHTML = viewEnterRoomNumber(); break;
    case 'screen-room-identified': container.innerHTML = viewRoomIdentified(); break;
    case 'screen-update-status': container.innerHTML = viewUpdateStatus(); break;
    case 'screen-status-updated': container.innerHTML = viewStatusUpdated(); break;
    case 'faculty-home': container.innerHTML = viewFacultyHome(); break;
    case 'admin-home': container.innerHTML = viewAdminHome(); break;
    case 'status-history': container.innerHTML = viewStatusHistory(); break;
    case 'admin-manage-rooms': container.innerHTML = viewAdminManageRooms(); break;
    case 'notifications': container.innerHTML = viewNotifications(); break;
    case 'profile': container.innerHTML = viewProfile(); break;
    default: container.innerHTML = viewLogin(); break;
  }
}

// Boot prototype
render();
</script>
</body></html>
